[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liveopt"
version = "0.1.0"
description = "MAPLE: Memory-Augmented Planning with Language and Evolution"
requires-python = ">=3.10"

[project.optional-dependencies]
demo = ["fastapi", "uvicorn", "numpy", "scipy"]

[project.urls]
Repository = "https://anonymous.4open.science/r/MAPLE00"
Homepage = "https://anonymous.4open.science/w/MAPLE-demo-review-F98B/"

[project.scripts]
liveopt-demo = "demo.server:main"

[tool.setuptools.packages.find]
include = ["evo2*", "demo*"]

[tool.setuptools.package-data]
evo2 = ["skills/catalog/**/*.md", "skills/catalog/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
